<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 40" width="150" height="40" role="img" aria-label="CCC Admin">
  <title>CCC Admin</title>
  <!-- Mark: three concentric arcs — a "C" repeated three times, and a signal wave -->
  <g fill="none" stroke="#1a1f3c" stroke-linecap="round">
    <path d="M 30.29 7.74 A 16 16 0 1 0 30.29 32.26" stroke-width="3.2" opacity="0.35"/>
    <path d="M 27.07 11.57 A 11 11 0 1 0 27.07 28.43" stroke-width="3.2" opacity="0.65"/>
    <path d="M 23.86 15.40 A 6 6 0 1 0 23.86 24.60" stroke-width="3.2"/>
  </g>
  <circle cx="20" cy="20" r="2.6" fill="#ce1126"/>

  <!-- Wordmark -->
  <text x="50" y="19.5"
        font-family="'Space Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="19" font-weight="700" letter-spacing="0.5" fill="#1a1f3c">CCC</text>
  <text x="50.5" y="32"
        font-family="'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="8" font-weight="600" letter-spacing="3.2" fill="#767c9a">ADMIN</text>
</svg>
